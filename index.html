<!-- ============ SCENE 0 · INTRO ============ -->
<template id="scene-0">
<div style="position: absolute; left: 0; top: 72px; width: 1280px; height: 648px;">
<div style="position: absolute; left: 0; top: 24px; width: 1280px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;"><div style="font-size: 16px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: #3E8A2A; animation: up .8s .4s both;">Customer Support &middot; New Agent Training</div><h1 class="disp" style="margin: 0; font-size: 60px; line-height: 1.05; font-weight: 700; color: #0B2545; animation: up .9s .9s both;">Translation cases</h1><p style="margin: 0; font-size: 23px; color: #3B4F6B; max-width: 1040px; animation: up .9s 1.6s both;">New content on the translated site isn&rsquo;t translated yet.</p></div>
<div style="position: absolute; left: 40px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #DCE7F7; border: 3px solid #1466F0; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 5s both;"><span class="eb" style="color: #1466F0;">What</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">A customer sees new or updated content on their translated site that isn&rsquo;t translated yet, and reports it in a case.</span></div>
<div style="position: absolute; left: 450px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #FCE3CC; border: 3px solid #C2410C; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 9s both;"><span class="eb" style="color: #C2410C;">Why it happens</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">We have a 1 business-day SLA to auto-crawl, detect and queue new content. Many customers don&rsquo;t want to wait.</span></div>
<div style="position: absolute; left: 860px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #E5F4DE; border: 3px solid #2F7A22; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 13s both;"><span class="eb" style="color: #2F7A22;">Who owns it</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">You push the content, the TAM assigns a linguist, a PE activates it if needed. You validate and close.</span></div>
<div style="position: absolute; left: 160px; top: 436px; width: 960px; height: 104px; border-radius: 20px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; gap: 18px; padding: 0 30px; animation: up .7s 19s both;"><svg width="40" height="40" style="flex-shrink: 0; color: #8FD16F;"><use href="#dc-check"></use></svg><span style="font-size: 21px; font-weight: 900; line-height: 1.4;">Push it, find the PID, hand it to the TAM with everything they need.</span></div>
</div>
</template>

<!-- ============ SCENE 1 · SPOT IT ============ -->
<template id="scene-1">
<div style="position: absolute; left: 0; top: 72px; width: 1280px; height: 648px;">
<div class="sh" style="animation: up .6s .2s both;"><div class="h2">Part 1: Spot a Translation case</div><div class="h2s">New content, not translated yet.</div></div>
<div class="sc" style="left: 40px; width: 389.33px; background: #DCE7F7; color: #1466F0; animation: up .6s 1.4s both, litRing 18s 4s both;"><div class="sr"><span class="sn" style="background: #1466F0;">1</span><span class="tg" style="background: #1466F0;">Details</span></div><div class="st">The case type</div><svg class="mk" width="28" height="28" style="animation: pop .5s 21.4s both;"><use href="#dc-check"></use></svg></div>
<div class="sc" style="left: 445.33px; width: 389.33px; background: #DCE7F7; color: #1466F0; animation: up .6s 1.6s both, litRing 18s 22s both;"><div class="sr"><span class="sn" style="background: #1466F0;">2</span><span class="tg" style="background: #1466F0;">URL</span></div><div class="st">What they report</div><svg class="mk" width="28" height="28" style="animation: pop .5s 39.4s both;"><use href="#dc-check"></use></svg></div>
<div class="sc" style="left: 850.67px; width: 389.33px; background: #E5F4DE; color: #2F7A22; animation: up .6s 1.8s both, litRing 18s 40s both;"><div class="sr"><span class="sn" style="background: #2F7A22;">3</span><span class="tg" style="background: #2F7A22;">SLA</span></div><div class="st">Why it happens</div><svg class="mk" width="28" height="28" style="animation: pop .5s 57.4s both;"><use href="#dc-check"></use></svg></div>
<div class="panel" style="animation: up .7s 2.2s both;">

      [[0, "Part 1: spot a Translation case."], [5000, "In the case's Details tab, the Type field says Translation."], [8000, "It means new content on the translated site isn't translated yet."], [23000, "The customer sends a URL on the translated site, and tells you what's missing."], [27000, "Here, the page is in Spanish, but one block is still in English."], [41000, "Why does this happen? New content gets added on the origin site."], [45000, "Our system auto-crawls, detects, and queues it within one business day. Many customers don't want to wait, so they open a case."], [51000, "Your job is to speed it up: push the content now, so it's queued today."]],
      [[0, "Part 2: confirm and acknowledge."], [5000, "Confirm the basics first: the URLs work, the screenshots show what's missing, and the instructions are clear."], [9000, "If it's behind a login, you'll need credentials."], [12000, "If something's unclear or missing, ask the customer before you push anything."], [23000, "Then acknowledge the customer with a short, friendly, customer-visible note."], [27000, "Thank them, and let them know the team will review it and follow up if any questions arise."], [41000, "While you wait on the TAM, set the case to Pending, and update the due date."], [45000, "Standard cases: next week. Express or Critical: next day."]],
      [[0, "Part 3: push the content into the queue."], [5000, "From the browser: add question mark, mpactionid equals 16408, plus your last name, to the page URL."], [10000, "Load the page, and go through any steps to show the missing content."], [14000, "Remember: this only queues the content for translation."], [25000, "If the content is behind a login, or several steps into a flow, use Charles, the proxy debugging tool."], [30000, "Its Rewrite adds mpactionid 16408 and your last name to every request, so the content gets queued from where it really comes from."], [36000, "Go through the flow just like the customer. The Charles video covers the setup."], [45000, "You can also schedule the URL in ControlCenter."], [50000, "Whichever way you use, pushing doesn't translate anything. It only puts the content in the queue."]],
      [[0, "Part 4: find the PID in ControlCenter."], [5000, "Open Translation Project Manager, and search the customer account."], [10000, "Then click WC on the card for the right language."], [23000, "In Search Page Queue, set Project Code to All, and type your last name in Enter Url. Then search."], [28000, "You'll see only the pages you pushed. Tick the PID box, and click Update."], [33000, "Your last name is the marker that keeps your pushes separate."], [41000, "If the status is New, copy the PID number."], [45000, "Add it to your detailed note to the TAM, with steps to replicate and a screenshot. The PID is how the TAM finds exactly what you pushed."]],

  /* ---------- original background jazz, synthesized live ---------- */
  bars() {
    // [bass walk (MIDI), chord voicing (MIDI)] — ii-V-I in F with turnarounds, 80 bpm swing
    return [
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9

      [[50, 48, 45, 44], [54, 60, 64, 69]], // D9

      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13

  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 1.0);
      const noise = ctx.createBuffer(1, len, ctx.sampleRate);

      this.ctx = ctx; this.master = master; this.noise = noise;
      this.beat = 0; this.nextT = 0;
      return true;
    } catch (e) { return false; }
  }
  pianoNote(m, t, vel, dur) {
    const c = this.ctx;
    const f = this.hz(m);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(900, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vel * 0.3, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(this.master);
    [[1, 1], [2, 0.28], [3, 0.08]].forEach((h) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * h[0];
      const hg = c.createGain(); hg.gain.value = h[1];
      o.connect(hg); hg.connect(lp);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  pianoChord(notes, t, vel, dur) {
    notes.forEach((m, i) => this.pianoNote(m, t + i * 0.018, vel, dur));
  }
  tap(t, vol, dur, freq) {
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  scheduleBeat(i, t) {
    const spb = 60 / 80;
    const sw = spb * 2 / 3;
    const barIx = Math.floor(i / 4) % 8;
    const bar = this.bars()[barIx];
    const b = i % 4;
    this.tap(t, 0.014, 0.25, 7500);
    if (b === 1 || b === 3) {
      this.tap(t + sw, 0.01, 0.18, 7500);
      this.tap(t, 0.012, 0.05, 9500);
    }

      this.pianoChord(bar[1], t + 0.03, 0.028, 2.2);

    const v = Math.floor(i / 4) % 2;
    if (b === 2 && v === 0) this.pianoChord(bar[1], t + sw, 0.018, 1.2);

      this.musicLive = true;
      this.beat = 0;
      this.nextT = c.currentTime + 0.1;
      this.master.gain.cancelScheduledValues(c.currentTime);
      this.master.gain.setValueAtTime(0.0001, c.currentTime);
      this.master.gain.exponentialRampToValueAtTime(0.55, c.currentTime + 1.5);
    }
  }
  musicStop(fade) {
    if (!this.ctx) return;
    const c = this.ctx;
    this.musicLive = false;
    const now = c.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(Math.max(this.master.gain.value, 0.0001), now);
    this.master.gain.exponentialRampToValueAtTime(0.0001, now + (fade || 0.3));
  }
  musicPause() { if (this.ctx) { try { this.ctx.suspend(); } catch (e) {} } }
  musicResume() { if (this.ctx && this.state.music) { try { this.ctx.resume(); } catch (e) {} } }

  componentDidMount() {
    this.iv = setInterval(() => this.tick(), 200);
    this.au = setInterval(() => this.schedule(), 60);
  }
  componentWillUnmount() {
    clearInterval(this.iv); clearInterval(this.au); clearTimeout(this.to);
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} }
  }
  tick() {
    const s = this.state;
    if (!s.playing || s.scene < 0) return;
    const d = this.durs();
    const el = s.el + 200;
    if (el >= d[s.scene]) {
      if (s.scene < d.length - 1) this.setState({ scene: s.scene + 1, el: 0 });
      else { this.setState({ el: d[s.scene], playing: false, ended: true }); this.musicStop(3); }
    } else {
      this.setState({ el: el });
    }
  }
  go(i, off) {
    off = off || 0;
    clearTimeout(this.to);
    this.musicStart();
    this.musicResume();
    this.setState({ scene: -1, el: 0 });
    this.to = setTimeout(() => {
      this.setState({ scene: i, el: off, started: true, playing: true, ended: false });
      if (off) setTimeout(() => this.sync(off), 60);
    }, 40);
  }
  sync(off) {
    try {
      const st = document.querySelector('.stage');
      if (!st || !st.getAnimations) return;
      st.getAnimations({ subtree: true }).forEach((a) => { try { a.currentTime = off; } catch (e) {} });
    } catch (e) {}
  }
  jump(delta) {
    const d = this.durs();
    const s = this.state;
    const cur = s.scene < 0 ? 0 : s.scene;
    let t = 0;
    for (let i = 0; i < cur; i++) t += d[i];
    t += (s.scene < 0 || !s.started) ? 0 : s.el;
    const total = d.reduce((a, b) => a + b, 0);
    t = Math.max(0, Math.min(t + delta, total - 500));
    let i = 0;
    while (i < d.length - 1 && t >= d[i]) { t -= d[i]; i++; }
    this.go(i, t);
  }
  fmt(ms) {
    const t = Math.floor(ms / 1000);
    const m = Math.floor(t / 60);
    const sec = t % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  renderVals() {
    const s = this.state;
    const d = this.durs();
    const total = d.reduce((a, b) => a + b, 0);
    const cur = s.scene < 0 ? 0 : s.scene;
    let done = 0;
    for (let i = 0; i < cur; i++) done += d[i];
    done += s.scene < 0 ? 0 : s.el;
    const vis = s.started ? s.scene : -2;
    const chapters = this.labels().map((label, i) => ({
      label: label,
      cls: s.started && i === cur ? 'on' : (s.started && i < cur ? 'done' : ''),
      go: () => this.go(i)
    }));
    return {
      s0: vis === 0, s1: vis === 1, s2: vis === 2, s3: vis === 3, s4: vis === 4, s5: vis === 5, s6: vis === 6, s7: vis === 7,
      showCover: !s.started,
      pauseCls: s.playing ? '' : 'paused',
      isPlaying: s.playing,
      notPlaying: !s.playing,
      playLabel: s.playing ? 'Pause' : (s.ended ? 'Replay' : 'Play'),
      progressW: (Math.min(1, done / total) * 100).toFixed(2) + '%',
      timeLabel: this.fmt(done) + ' / ' + this.fmt(total),
      chapters: chapters,
      steps: [1, 2, 3, 4, 5, 6, 7].map((n) => ({ n: n, on: s.started && s.scene >= 0 && s.scene === n })),
      showSubs: s.subsOn && s.started,
      subs: (() => {
        const L = s.scene >= 0 ? this.subLines()[s.scene] : [];
        let act = -1;
        L.forEach((c, i) => { if (s.el >= c[0]) act = i; });
        return L.map((c, i) => ({ text: c[1], on: i === act }));
      })(),
      subsOn: s.subsOn,
      subsLabel: s.subsOn ? 'Hide captions' : 'Show captions',
      subsColor: s.subsOn ? '#8FD16F' : '#A9B8CC',
      toggleSubs: () => this.setState({ subsOn: !this.state.subsOn }),
      musicOn: s.music,
      musicOff: !s.music,
      musicLabel: s.music ? 'Music on' : 'Music off',
      toggleMusic: () => {
        const on = !this.state.music;
        this.setState({ music: on }, () => {
          if (!on) this.musicStop(0.6);
          else if (this.state.playing) this.musicStart();
        });
      },
      togglePlay: () => {
        if (!this.state.started || this.state.ended) this.go(0);
        else {
          const playing = !this.state.playing;
          if (playing) this.musicResume(); else this.musicPause();
          this.setState({ playing: playing });
        }
      },
      replay: () => this.go(0),
      back10: () => this.jump(-10000),
      fwd10: () => this.jump(10000),
      prev: () => this.go(Math.max(0, cur - 1)),
      next: () => this.go(Math.min(d.length - 1, cur + 1))
    };
  }
}

Player.prototype.setState = function (obj, cb) { Object.assign(this.state, obj); this.render(); if (cb) cb(); };
Player.prototype.render = function () {
  const v = this.renderVals();
  const $ = (id) => document.getElementById(id);
  const s = this.state;
  const vis = s.started ? s.scene : -2;
  if (vis !== this._vis) {
    this._vis = vis;
    const tpl = $('scene-' + vis);
    $('sceneHost').innerHTML = tpl ? tpl.innerHTML : '';
  }
  $('stage').classList.toggle('paused', !s.playing);
  $('cover').hidden = !v.showCover;
  const st = v.steps.find((x) => x.on);
  const stn = st ? st.n : 0;
  if (stn !== this._step) { this._step = stn; $('steps').innerHTML = stn ? STEP_HTML.split('{{st.n}}').join(String(stn)) : ''; }
  const sb = v.showSubs ? v.subs.find((x) => x.on) : null;
  const key = sb ? s.scene + '|' + sb.text : '';
  if (key !== this._sub) {
    this._sub = key;
    $('subs').innerHTML = '';
    if (sb) { const d = document.createElement('div'); d.innerHTML = SUB_OPEN + '</div>'; d.firstChild.textContent = sb.text; $('subs').appendChild(d.firstChild); }
  }
  $('prog').style.width = v.progressW;
  $('timeLabel').textContent = v.timeLabel;
  $('playLabel').textContent = v.playLabel;
  $('playBtn').setAttribute('aria-label', v.playLabel);
  $('icoPause').hidden = !v.isPlaying; $('icoPlay').hidden = v.isPlaying;
  $('musicLabel').textContent = v.musicLabel; $('musicBtn').setAttribute('aria-label', v.musicLabel); $('musicBtn').setAttribute('aria-pressed', String(v.musicOn));
  $('icoMusicOn').hidden = !v.musicOn; $('icoMusicOff').hidden = v.musicOn;
  $('subsBtn').setAttribute('aria-label', v.subsLabel); $('subsBtn').setAttribute('aria-pressed', String(v.subsOn)); $('subsIcon').setAttribute('stroke', v.subsColor);
  const ck = v.chapters.map((c) => c.cls).join(',');
  if (ck !== this._chips) {
    this._chips = ck;
    const host = $('chapters'); host.innerHTML = '';
    v.chapters.forEach((c, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + c.cls; b.textContent = c.label;
      b.addEventListener('click', () => this.go(i)); host.appendChild(b);
    });
  }
};
const P = new Player();
const call = (k) => () => P.renderVals()[k]();
document.getElementById('coverPlay').addEventListener('click', call('togglePlay'));
document.getElementById('playBtn').addEventListener('click', call('togglePlay'));
document.getElementById('replayBtn').addEventListener('click', call('replay'));
document.getElementById('prevBtn').addEventListener('click', call('prev'));
document.getElementById('back10Btn').addEventListener('click', call('back10'));
document.getElementById('fwd10Btn').addEventListener('click', call('fwd10'));
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { e.preventDefault(); call('back10')(); } else if (e.key === 'ArrowRight') { e.preventDefault(); call('fwd10')(); } else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); call('togglePlay')(); } });
document.getElementById('nextBtn').addEventListener('click', call('next'));
document.getElementById('musicBtn').addEventListener('click', call('toggleMusic'));
document.getElementById('subsBtn').addEventListener('click', call('toggleSubs'));
P.render();
P.componentDidMount();

</script>
</body>
